services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # one-time after `docker compose up -d`:
    #   docker compose exec ollama ollama pull llama3.2:1b   (~1.3 GB, CPU-friendly)

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false  # dev only — disables login so API keys aren't needed
      # Allow the Pebble config page (loaded from a data: URL) to call /api/*:
      - CORS_ALLOW_ORIGIN=*
    depends_on:
      - ollama

volumes:
  ollama_data: {}
